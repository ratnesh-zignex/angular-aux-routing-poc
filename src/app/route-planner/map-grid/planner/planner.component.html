<!-- Popout Button - Only show in main window when grid is NOT popped out -->
<div
  class="grid-controls"
  *ngIf="isBrowser && !isPopoutMode && !popoutService.isGridPoppedOut()"
>
  <button class="btn-primary" (click)="popOutGrid()">Pop Out Grid</button>
</div>

<div *ngIf="isBrowser" class="planner-container">
  <!-- Grid Toolbar - Only show in popout mode -->
  <div class="grid-toolbar" *ngIf="isPopoutMode">
    <div class="toolbar-buttons">
      <button
        *ngFor="let btn of currentGridBtnList"
        (click)="handleToolbarClick(btn.id)"
        [class]="btn.className"
        [title]="btn.toolTipText"
        [disabled]="btn.disabled"
        class="toolbar-btn"
      >
        <span class="btn-icon"></span>
        <span class="btn-label">{{ btn.name }}</span>
      </button>
    </div>
  </div>

  <!-- Grid Section - Hide in main window when popped out -->
  <div
    class="grid-wrapper"
    *ngIf="!popoutService.isGridPoppedOut() || isPopoutMode"
    [ngClass]="{ 'popout-grid': isPopoutMode, 'main-grid': !isPopoutMode }"
  >
    <wj-flex-grid
      #flexGrid
      [itemsSource]="gridData"
      [autoGenerateColumns]="false"
      [columnGroups]="columns"
      selectionMode="ListBox"
      (initialized)="onGridInitialized($event)"
      style="height: 100%; width: 100%"
    >
    </wj-flex-grid>
  </div>
</div>
<!-- Popup Manager - Show in popout mode -->
<app-popup-manager *ngIf="isPopoutMode"></app-popup-manager>
