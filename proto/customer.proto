}
message ScenarioCustomerRequest {
  int64 scenario_id = 1;
  string srvc_ordr_rt_dow = 2;
  repeated string srvc_ordr_rt_no = 3;
}

message RPCustomerReportResponse{
  repeated RPCustomerReportData rp_customer_list=1;
}
