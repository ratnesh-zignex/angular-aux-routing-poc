  string srvcCity = 12;
  string srvcStateCd = 13;
  string srvcZipCd = 14;
  double srvcLat = 15;
  double srvcLon = 16;
  string notes1 = 17  [deprecated = true];
  string srvcOrdrStartTm1 = 18;
  string srvcOrdrStopTm1 = 19;
  string srvcOrdrWeekCode =20;
  string containerNotes1 = 21;
  string containerNotes2 = 22 [deprecated = true];
  string containerNotes3 = 23;
  string userCustom1 = 24;
  string userCustom2 = 25;
  string userCustom3 = 26;
  int64 acctId = 27;
  string opsUnitCd = 28;
  string srvcRtTypCd = 29;
  string acctNm = 30;
  string srvcUnitNotes1 = 31;
  string srvcUnitNotes2 = 32;
  string srvcUnitNotes3 = 33;
  string srvcUnitNotes4 = 34;
  string srvcUnitNotes5 = 35;
  string userCustom4 = 36;
  string userCustom5 = 37;
  string containerNotesNo2 = 38;
}


message MonthlyPlannerCustomer {
  string cid = 1;
  string name = 2;
  double uqty = 3;
  double uVolVal = 4;
  double uWtVal = 5;
  string addr = 6;
  string cty = 7;
  string state = 8;
  string zip = 9;
  string cntry = 10;
  double lat = 11;
  double lon = 12;
  string geoSt = 13;
  int32 frqByWk = 14;
  int64 cuId = 15;
  int64 unId = 16;
  int64 loId = 17;
  DayOfWeek orgRt = 18;

  int32 wkClstId = 19;
  string sos = 20;
  DayOfWeek pRt = 21;
  string lkFlg = 22;
  string edId=23;
  string dayChangeP=24;
  string slockCd=25;
  string rtWkCd = 26;
  string prRtWkCd = 27;
  string prOpUnCd = 28;
  string prDispCd = 29;
  string srvcUnitNote1=30;

  DayOfWeek prRouteWeek1 = 31;
  DayOfWeek prSNoWeek1 = 32;
  DayOfWeek prRouteWeek2 = 33;
  DayOfWeek prSNoWeek2 = 34;
  DayOfWeek prRouteWeek3 = 35;
  DayOfWeek prSNoWeek3 = 36;
  DayOfWeek prRouteWeek4 = 37;
  DayOfWeek prSNoWeek4 = 38;
  string srcWkCdCh = 39;
  string srcOrdrRtDow = 40;
  DayOfWeek srcRouteWeek = 41;
  string weekChangeP = 42;
}

message MonthlyPlannerCustomerRequest {
  int64 acct_id = 1;
  string ops_unit_cd = 2;
  repeated string srvc_rt_typ_cd = 3;
  repeated string srvc_ordr_rt_wk_cd = 4;
  repeated int32 sel_week_no = 5;
  string userNm = 6;
}

message MonthlyPlannerCustomerResponse {
  repeated MonthlyPlannerCustomer monthly_planner_customer_list = 1;
}

message WeeklyCustomerShort {
  string cid = 1;
  string name = 2;
  double lat = 3;
  double lon = 4;
  string dow=5;
  string lkFlg = 6;
  string addr=7;
  string srcDow=8;
  int64 unId=9;
  int32 wkClstId = 10;
  string srvcUnitNote1=11;
  int64 loId = 12;
  string srvcUnitNotes2=14;
  string materialType=15;
  string srvcUnitNotes3=16;
  WeeklyCustomerOtherField weeklyCustomerOtherField = 13;
  string srvcRtTypCd=17;
}

message WeeklyCustomerOtherField {
    string rtNo = 1;
     double srvcUnitQty = 8;
     double srvcUnitVolVal = 9;
}

message WeeklyCustomerShortResponse {
  repeated WeeklyCustomerShort weekly_customer_list = 1;
  bool shortRes=2;
}

message UngeocodedCustomerRequest {
  int64 acct_id = 1;
  string ops_unit_cd = 2;
  repeated string srvc_rt_typ_cd = 3;
  string userNm = 4;
  string lobCd = 5;
}

message UngeocodedCustomer {
  string cid = 1;
  string name = 2;
  string addr = 3;
  string cty = 4;
  string state = 5;
  string zip = 6;
  string cntry = 7;
  double lat = 8;
  double lon = 9;
  string sos = 10;
  string edId = 11;
  int64 loId = 12;
  string geoSt = 13;
  int64 srvcUnitId = 14;
  string srvcGeocodeSrc = 15;
  string srvcGeocodeSrcDesc = 16;
  string srvcGeocodeConf = 17;
}

message UngeocodedCustomerResponse {
  repeated UngeocodedCustomer ungeocoded_customer_list = 1;
}
message LocationResponse {
  string road_id = 1;
  string side_of_street = 2;
  double offset_lat = 3;
  double offset_lon = 4;
  string census_id = 5;
  string street_name = 6;
  string loc_src = 7;
  int64 srvc_loc_id = 8;
  string user_id = 9;
  bool geocode_status = 10;
  double srvc_lon = 11;
  double srvc_lat = 12;
  string geo_conf =13;
  int64 acct_id = 14;
  string ops_unit_cd = 15;
  string route_type = 16;
}

message BatchLocationResponse {
  repeated LocationResponse batch_location_response_list = 1;
}

message BatchLocationRequest {
  repeated LocationResponse batch_location_request = 1;
}
// The customer service definition.
service CustomerService {

  rpc fetchWeeklyCustomersShort(CustomerRequest) returns (WeeklyCustomerShortResponse) {}
  rpc fetchBatchGeocodeResponse(BatchLocationRequest) returns (BatchLocationResponse) {}
}
