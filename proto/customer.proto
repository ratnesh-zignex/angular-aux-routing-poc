syntax = "proto3";
package customer;

option java_package="com.zignex.app.proto.customer";
option java_multiple_files = true;

message CustomerRequest {
  int64 acct_id = 1;
  string ops_unit_cd = 2;
  repeated string srvc_rt_typ_cd = 3;
  repeated string srvc_ordr_rt_dow = 4;
  repeated string srvc_ordr_rt_no = 5;
  string userNm = 6;
  string lobCd = 7;
}

message CustomerResponse {
  repeated Customer customer_array = 1;
}

message Customer {
  string cid = 1;
  string name = 2;
  string rNo = 3;
  int32 sNo = 4;
  double uqty = 5;
  double uVolVal = 6;
  double uWtVal = 7;
  int32 srvctm = 8;
  string strtm = 9;
  string stptm = 10;
  string addr = 11;
  string cty = 12;
  string state = 13;
  string zip = 14;
  string cntry = 15;
  double lat = 16;
  double lon = 17;
  string srcDOW = 18;
  string srcRNo = 19;
  int32 srcSNo = 20;
  string geoSt = 21;
  string note1 = 22;
  int64 uid = 23;
  int64 cuId = 24;
  int64 unId = 25;
  int64 orId = 26;
  int64 loId = 27;
  int64 noId = 28;
  int32 clstId = 29;
  string sos = 30;
  string lkFlgD = 31;
  double adTm = 32;
  int32 tTsrv = 33;
  double tcTsrv = 34;
  string pRDow = 35;
  int32 oPr = 36;
  string srvcOrdrSrcDispCd=37;
  int32 sOLNo = 38;
  string edId=39;
  string pRt = 40;
  int32 pSeq = 41;
  string vStLc = 43;
  string vEdLc = 44;
  string osPkup= 45;
  string prOpUnCd = 46;
  string prDispCd = 47;
  string rtWkCd = 48;
  int32 wkNo = 49;
  string note2=50;
  int32 srvcUnitAccCdId = 51;
  string srvcUnitAccCd = 52;
  string notes1=53;
  string notes3=54;
  string userCustom1=55;
  string userCustom2=56;
  string userCustom3=57;
  string creationDtm=58;
  string srvcOrdrCode=59;
  string userDefinedWeekCd=60;
  double totCostTsrvPrYd = 61;
  string userId=62;
  string srvcUnitNote1=63;
  string materialType=64;
  int32 weekCodeLockFlag=65;
  string srvcGeocodeSrc = 66;
  string srvcGeocodeSrcDesc = 67;
  string srvcGeocodeConf = 68;
  int32 srvcUnitFrqByWk = 69;
  string notes4=70;
  string notes5=71;
  string userCustom4=72;
  string userCustom5=73;
  string srvcUnitNotes2=74;
  int32 mapPageNo=75;
  string srvcUnitNotes3=76;
  int32 srvcUnitLftAccPnlt = 77;
  int32 srvcUnitRgtAccPnlt = 78;
  string dchg = 81;  
  string dayChangeP = 82;  
  string weekChange = 83;  
  string weekChangeP = 84;
}
message CustomerResponseShort {
  repeated CustomerShortMsg customer_list = 1;
}
message CustomerShortMsg {
  string cid = 1;
  string name = 2;
  string rNo = 3;
  int32 sNo = 4;
  double uqty = 5;
  double uVolVal = 6;
  double uWtVal = 7;
  int32 srvctm = 8;
  string strtm = 9;
  string stptm = 10;
  string addr = 11;
  double lat = 12;
  double lon = 13;
  string srcDOW  = 14;
  string srcRNo  = 15;
  int32 srcSNo  = 16;
  string geoSt  = 17;
  string note1  = 18;
  int64 uid = 19;
  int64 cuId = 20;
  int64 unId = 21;
  int64 orId = 22;
  int64 loId = 23;
  int64 noId = 24;
  int32 clstId  = 25;
  int32 oPr  = 26;
  string srvcOrdrSrcDispCd=27;
  int32 sOLNo  = 28;
  string osPkup = 29;
  string note2 = 30;
  int32 srvcUnitAccCdId = 31;
  string srvcUnitAccCd = 32;
  string notes1=33;
  string notes3=34;
  string userCustom1=35;
  string userCustom2=36;
  string userCustom3=37;
