  string notes5=50;
  string userCustom4=51;
  string userCustom5=52;
  string srvcUnitNotes2=53;
  string srvcUnitNotes3=54;
}
message DayOfWeek {
  string monday = 1;
  string tuesday = 2;
  string wednesday = 3;
  string thursday = 4;
  string friday = 5;
  string saturday = 6;
  string sunday = 7;
}

message WeeklyCustomer {
  string cid = 1;
  string name = 2;
  double uqty = 3;
  double uVolVal = 4;
  double uWtVal = 5;
  string addr = 6;
  string cty = 7;
  string state = 8;
  string zip = 9;
  string cntry = 10;
  double lat = 11;
  double lon = 12;
  string geoSt = 13;
  int32 frqByWk = 14;
  int64 cuId = 15;
  int64 unId = 16;
  int64 loId = 17;
  DayOfWeek orgRt = 18;
  DayOfWeek sRt = 19;
  int32 wkClstId = 20;
  string sos = 21;
  DayOfWeek pRt = 22;
  string lkFlg = 23;
  string edId=24;
  string slockCd = 26;
  string rtWkCd = 27;
  string prRtWkCd = 28;
  string prOpUnCd = 29;
  string prDispCd = 30;
  int32 wkNo = 31;
  string srvcUnitNote1=32;
  int32 srvcUnitAccCdId = 33;
  string srvcUnitAccCd = 34;
  string srvcUnitCd=35;
  string creationDtm=36;
  string userDefinedWeekCd=37;
  double totCostTsrv = 38;
  double totCostTsrvPrYd = 39;
  int32 weekCodeLockFlag =40;
  int32 priority = 41;
  string srvcUnitNotes2=42;
  string materialType = 43;
  string srvcUnitNotes3=44;
  string srvcRtTypCd=45;
